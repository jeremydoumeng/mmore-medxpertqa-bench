[project]
name = "mmore-medxpertqa-bench"
version = "0.1.0"
description = "MedXpertQA-MM benchmark of the mmore-rag PR #281 multimodal RAG pipeline (Qdrant fork). Clariden-internal."
requires-python = ">=3.11,<3.12"

# Pinned to the exact versions used for the canonical 7B (job 2380399) and
# 72B (job 2384325) runs whose results are recorded in manifests/expected_results.yaml.
# Resolve via `uv pip install -e .` or `pip install -e .` after activating
# a Python 3.11 venv.
dependencies = [
  # Core deep-learning stack
  "torch==2.11.0",                          # built against cu126
  "vllm==0.20.0",                           # multimodal serving + batched generate
  "transformers==5.8.0",                    # Qwen2.5-VL processor + chat template
  "accelerate==1.13.0",
  "datasets==4.8.5",                        # HF datasets for MedXpertQA + MedPix

  # Tabular IO
  "pandas==3.0.2",
  "pyarrow==24.0.0",
  "pyyaml==6.0.3",

  # Imaging
  "pillow==12.1.1",

  # mmore-rag pipeline deps (consumed by the pinned submodule)
  "qdrant-client==1.17.1",
  "colpali-engine==0.3.15",
  "langchain==1.2.15",
  "langchain-core==1.3.2",
  "langchain-milvus==0.3.3",                # used by the indexer's sparse-vec utility
  "pymilvus==2.6.6",                        # imported tolerantly by the retriever
  "sentence-transformers==5.4.1",

  # Misc
  "tqdm==4.67.3",
]

[project.optional-dependencies]
audit = [
  # rapidfuzz can speed up gold_coverage but is not required (our pure-python
  # token-set ratio matches the rapidfuzz behaviour we need).
  "rapidfuzz>=3.0",
]

[tool.uv]
# Use `uv pip install -e .` to materialize the venv reproducibly.
package = false
